plugins {
    id 'java'
}

group = 'com.limacharlie.orderflow'
version = '0.5.0'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven {
        url 'https://maven.bookmap.com/maven2/releases/'
    }
}

def bookmapApiVersion = project.findProperty('bookmapApiVersion') ?: '7.6.0.20'

// The manifest identifies the checkout, not a release certification.
def sourceRevision = providers.environmentVariable('GITHUB_SHA').orElse(
    providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.map { it.trim() }
)
def workingTreeDirty = providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.map { !it.trim().isEmpty() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    implementation 'org.zeromq:jeromq:0.6.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly group: 'com.bookmap.api', name: 'api-core', version: bookmapApiVersion
    compileOnly group: 'com.bookmap.api', name: 'api-simplified', version: bookmapApiVersion
    testImplementation group: 'com.bookmap.api', name: 'api-core', version: bookmapApiVersion
    testImplementation group: 'com.bookmap.api', name: 'api-simplified', version: bookmapApiVersion
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    archiveFileName = 'bookmap-orderflow-exporter-v0.5a.jar'
    manifest { attributes 'Implementation-Version': project.version, 'Orderflow-Build-Revision': '0.5a', 'Orderflow-Source-Revision': sourceRevision.get(), 'Orderflow-Working-Tree-Dirty': workingTreeDirty.get() }
}

test { useJUnitPlatform() }

tasks.register('writeFixtureClasspath') {
    dependsOn testClasses
    doLast { file("$buildDir/fixture-classpath.txt").text = sourceSets.test.runtimeClasspath.asPath }
}

tasks.register('smokeTestBundle', Zip) {
    dependsOn jar
    archiveFileName = 'orderflow-v0.5a-windows-smoke-test.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.jar)
    from('tools/windows') { exclude '*Tests.ps1' }
}
