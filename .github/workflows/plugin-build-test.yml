name: Plugin Build Test

on:
  push:
    branches:
      - main
      - 'ci/**'
      - 'v0.5/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compile and package Bookmap addon
        run: gradle --no-daemon clean test jar writeFixtureClasspath smokeTestBundle

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test canonical capture and summary validator
        run: python -m unittest discover -s tests -v

      - name: Smoke-test reproducible synthetic benchmark
        run: python tools/benchmark_exporter.py --classpath-file build/fixture-classpath.txt --cycles 10 --rate 100000 --output benchmark-result.json

      - name: Inspect packaged JAR
        shell: bash
        run: |
          test -f build/libs/bookmap-orderflow-exporter-v0.5a.jar
          jar tf build/libs/bookmap-orderflow-exporter-v0.5a.jar | grep 'com/limacharlie/orderflow/BookmapOrderflowExporter.class'
          jar tf build/libs/bookmap-orderflow-exporter-v0.5a.jar | grep 'org/zeromq/ZMQ.class'
          jar tf build/libs/bookmap-orderflow-exporter-v0.5a.jar | grep 'META-INF/THIRD-PARTY-NOTICES.txt'

      - name: Test Windows smoke launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/windows/Smoke-Test.Tests.ps1

      - name: Upload smoke-test bundle
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-v0.5a-smoke-test-${{ matrix.os }}
          path: build/distributions/orderflow-v0.5a-windows-smoke-test.zip
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bookmap-orderflow-exporter-v0.5a-${{ matrix.os }}
          path: build/libs/bookmap-orderflow-exporter-v0.5a.jar
          if-no-files-found: error
