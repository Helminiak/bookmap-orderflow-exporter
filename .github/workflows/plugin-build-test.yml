name: Plugin Build Test

on:
  push:
    branches:
      - main
      - 'ci/**'
      - 'v0.4/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compile and package Bookmap addon
        run: gradle --no-daemon clean jar

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test canonical capture and summary validator
        run: python -m unittest discover -s tests -v

      - name: Inspect packaged JAR
        shell: bash
        run: |
          test -f build/libs/bookmap-orderflow-exporter-v0.4.jar
          jar tf build/libs/bookmap-orderflow-exporter-v0.4.jar | grep 'com/limacharlie/orderflow/BookmapOrderflowExporter.class'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bookmap-orderflow-exporter-v0.4-${{ matrix.os }}
          path: build/libs/bookmap-orderflow-exporter-v0.4.jar
          if-no-files-found: error
